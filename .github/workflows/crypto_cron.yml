name: Run Crypto ETL Pipeline

on:
  schedule:
    # Se ejecuta de forma automatica cada hora (Cron Job)
    - cron: '0 * * * *'
  workflow_dispatch:
    # Te permite activar el robot manualmente desde la web cuando quieras

jobs:
  run-crypto-etl:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Configurar Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar librerias necesarias
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas sqlalchemy psycopg2-binary python-dotenv

    - name: Ejecutar Script ETL de Criptomonedas
      env:
        # Inyectamos los secretos del repositorio al entorno del servidor
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_PORT: ${{ secrets.DB_PORT }}
        DB_NAME: ${{ secrets.DB_NAME }}
      run: |
        python 04_Pipeline_Crypto_Streaming/etl_crypto.py