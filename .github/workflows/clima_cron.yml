name: Run Clima ETL Pipeline

on:
  schedule:
    # Se ejecuta de forma automatica cada 6 horas (Cron Job)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Esto permite activar el robot manualmente desde GitHub cuando se quiera probar

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v3

    - name: Configurar Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar librerias necesarias
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas sqlalchemy psycopg2-binary python-dotenv

    - name: Ejecutar Script ETL del Clima
      env:
        # Aqui le inyectamos los secretos que guardaste en la web al script
        OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_PORT: ${{ secrets.DB_PORT }}
        DB_NAME: ${{ secrets.DB_NAME }}
      run: |
        python 03_Pipeline_Clima_Realtime/etl_clima.py